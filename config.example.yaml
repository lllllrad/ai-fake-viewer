port: 3210
network:
  bindHost: 127.0.0.1 # set 0.0.0.0 to allow reader and overlay from another PC
  publicBaseUrl: "" # LAN mode: http://APP_PC_LAN_IP:3210
database: data/chat.sqlite
retentionDays: 7
youtube:
  enabled: false
  consentNoticeEnabled: false
  channelId: "" # optional UC channel ID for active-live discovery
  video: ""
  transport: grpc
  restFallback: true
chzzk:
  enabled: false
  consentNoticeEnabled: false
  # Register this exact URL in the CHZZK developer console. For a public HTTPS callback, replace only the origin.
  redirectUri: http://127.0.0.1:3210/oauth/chzzk/callback
soop:
  mode: disabled
  consentNoticeEnabled: false
  experimentalConsent: false
  streamerId: ""
  # Register this exact callback in the SOOP developer console.
  redirectUri: http://127.0.0.1:3210/oauth/soop/callback
capture:
  ffmpeg: ffmpeg
  backend: dshow # rtmp for a separate OBS PC and a local/LAN RTMP server
  device: OBS Virtual Camera
  url: "" # when backend is rtmp: rtmp://127.0.0.1:1935/program
  intervalMs: 3000
  programConfirmed: false
  # Normalized rectangles, applied before preview and upload.
  # Include every chat overlay and any private area in every scene.
  masks: []
audio:
  ffmpeg: ffmpeg # use scripts/ffmpeg-docker.sh on a Linux app PC with Docker
  url: "" # private RTMP APP_READ_URL from data/rtmp-urls.txt
  language: ko # input language (ISO-639-1); "" for automatic detection
  chunkSeconds: 10
  maxRequests: 360
ai:
  provider: chatgpt_subscription # or openai_api
  manualApproval: false # publish locally without human review
  reviewDraft: true # run a second model pass over each proposed reply
  visualMode: on_request # AI requests a masked frame only when needed; continuous retains old behavior
  gate:
    enabled: false # requires on_request and TYPESAFE_API_KEY
    model: jev-latest
    threshold: 0.8 # suppress only when Jev is sure timing is bad
    maxRequests: 360 # per process; separate from answer-model calls
    timeoutMs: 3000
  pacing:
    minSeconds: 35
    maxSeconds: 95
  contextWindowSeconds: 120
  maxCalls: 100
  maxInputTokens: 24000
  maxOutputTokens: 500
  maxUsd: null
  inputUsdPerMillion: null
  outputUsdPerMillion: null
  priceCheckedAt: ""
  description: A live broadcast. React only to visible events.
  personas:
    - name: Orbit
      style: Brief, curious Korean spectator.
    - name: Pebble
      style: Playful visual comparisons in short Korean.
